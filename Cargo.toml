[package]
name = "aspire-team"
version = "0.1.0"
edition = "2021"
description = "TUI retro (ratatui) para Aurelia, el cliente de Steam por línea de comandos"
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
image = "0.25"
anyhow = "1"
dirs = "5"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
